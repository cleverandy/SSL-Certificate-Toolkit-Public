name: Build and Release Windows EXE (PySide6)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test certificate logic and GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Build GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "assets;assets" --version-file windows_version_info.txt --name SSL_Certificate_Toolkit_v3.4.0 app.py
      - name: Generate checksum
        shell: pwsh
        run: (Get-FileHash dist/SSL_Certificate_Toolkit_v3.4.0.exe -Algorithm SHA256).Hash.ToLower() + '  SSL_Certificate_Toolkit_v3.4.0.exe' | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SSL-Certificate-Toolkit-v3.4.0-Windows
          path: |
            dist/SSL_Certificate_Toolkit_v3.4.0.exe
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release on main (once)
        if: github.ref == 'refs/heads/main' && github.repository == 'cleverandy/SSL-Certificate-Toolkit-Public'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (gh release view v3.4.0 2>$null)) {
            gh release create v3.4.0 dist/SSL_Certificate_Toolkit_v3.4.0.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "SSL Certificate Toolkit v3.4.0" --notes-file CHANGELOG.md
          }
