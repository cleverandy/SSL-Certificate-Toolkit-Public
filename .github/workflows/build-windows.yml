name: Build Windows EXE (PySide6)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test crypto core
        run: python -m unittest discover -s tests -v
      - name: Build GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "assets;assets" --name SSL_Certificate_Toolkit app.py
      - uses: actions/upload-artifact@v4
        with:
          name: SSL-Certificate-Toolkit-Windows
          path: dist/SSL_Certificate_Toolkit.exe
